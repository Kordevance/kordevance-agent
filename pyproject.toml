[project]
name = "kordevance"
version = "0.1.0"
description = ""
authors = [
    {name = "Guy Clement Kamdem"}
]

license = "LICENSE"
readme = "README.md"
requires-python = ">=3.11,<=3.14"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "cryptography (>=50.0.0,<51.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "greenlet (>=3.1.0,<4.0.0)",
    "pydantic-ai (>=2.29.0,<3.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "keyring (>=25.7.0,<26.0.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "click (>=8.4.2,<9.0.0)",
]

[project.scripts]
kordevance-gateway = "kordevance.gateway_runner:main"
kordi = "kordevance.cli.main:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "poethepoet (>=0.48.0,<0.49.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "import-linter (>=2.13,<3.0)"
]
packaging = [
    "pyinstaller (>=6.11.0,<7.0.0)"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # All error codes
    "F",  # All flake8 codes
    "W",  # All warning codes
    "B",  # All bugbear codes
    "I",  # All import checks
    "Q",  # All flake8-quotes checks
    "S",  # All security checks
    "N",  # All naming checks
    "C4", # Catch incorrect use of comprehensions, dict, list, etc
    "UP", # Modernize syntax (f-strings, newer type hints, etc.)
]

fixable = ["ALL"]
unfixable = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
files = ["kordevance"]
strict = true
show_error_codes = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
warn_unreachable = true
check_untyped_defs = true
disallow_incomplete_defs = true

[tool.poe.tasks]
lint = {sequence = [{cmd = "ruff check kordevance --fix"}, {cmd = "ruff format kordevance"}, ]}
typecheck = {cmd = "mypy"}
boundaries = {cmd = "lint-imports"}
check = ["lint", "typecheck", "boundaries"]
serve = {cmd = "gunicorn kordevance.application.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8080 --reload"}
bundle = {cmd = "pyinstaller packaging/gateway.spec --noconfirm --clean"}

[tool.importlinter]
root_package = "kordevance"

[[tool.importlinter.contracts]]
name = "Hex layering: application -> adapters -> domain"
type = "layers"
layers = [
    "kordevance.application",
    "kordevance.adapters",
    "kordevance.domain",
]
