name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag is x.x.x
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not in x.x.x form — aborting." >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux (${{ matrix.arch }})
    needs: prepare
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with packaging
      - name: Set version
        run: poetry version "${{ needs.prepare.outputs.version }}"
      - name: Build binaries
        run: poetry run poe bundle
      - name: Assemble release payload
        run: |
          cp packaging/linux/install.sh dist/kordevance/install.sh
          cp packaging/linux/uninstall.sh dist/kordevance/uninstall.sh
          cp packaging/linux/kordevance-gateway.service dist/kordevance/kordevance-gateway.service
          chmod +x dist/kordevance/install.sh dist/kordevance/uninstall.sh dist/kordevance/kordevance-gateway dist/kordevance/kordi
          mv dist/kordevance dist/kordevance-linux-${{ matrix.arch }}
          tar -czf kordevance-linux-${{ matrix.arch }}.tar.gz -C dist kordevance-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kordevance-linux-${{ matrix.arch }}
          path: kordevance-linux-${{ matrix.arch }}.tar.gz

  macos:
    name: Build macOS (${{ matrix.arch }})
    needs: prepare
    environment: production
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      MACOS_APP_SIGN_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        run: |
          missing=()
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_INSTALLER_CERT_P12_BASE64 MACOS_INSTALLER_CERT_PASSWORD CI_KEYCHAIN_PASSWORD NOTARY_API_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID MACOS_APP_SIGN_IDENTITY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required macOS signing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with packaging
      - name: Set version
        run: poetry version "${{ needs.prepare.outputs.version }}"
      - name: Build binaries
        run: poetry run poe bundle

      - name: Import signing certificates
        run: |
          security create-keychain -p "$CI_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > app_cert.p12
          security import app_cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm app_cert.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CI_KEYCHAIN_PASSWORD" build.keychain

      - name: Install rcodesign
        run: |
          curl -fsSL -o rcodesign.tar.gz \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz
          mkdir -p "$RUNNER_TEMP/rcodesign"
          tar -xzf rcodesign.tar.gz -C "$RUNNER_TEMP/rcodesign" --strip-components=1
          rm rcodesign.tar.gz
          echo "$RUNNER_TEMP/rcodesign" >> "$GITHUB_PATH"

      - name: Build, sign, and notarize pkg
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          KEYCHAIN: build.keychain
        run: sh packaging/macos/build-pkg.sh

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@v4
        with:
          name: Kordevance-${{ matrix.arch }}.pkg
          path: dist/Kordevance-${{ matrix.arch }}.pkg

  windows:
    name: Build Windows
    needs: prepare
    environment: production
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with packaging
      - name: Set version
        run: poetry version "${{ needs.prepare.outputs.version }}"
      - name: Build binaries
        run: poetry run poe bundle
      - name: Download NSSM
        run: |
          curl -fsSL -o nssm.zip https://nssm.cc/release/nssm-2.24.zip
          Expand-Archive nssm.zip -DestinationPath nssm-extracted
          Copy-Item nssm-extracted\nssm-2.24\win64\nssm.exe packaging\windows\nssm.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: bash
        env:
          KORDEVANCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: iscc packaging/windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Kordevance-Setup.exe
          path: dist/Kordevance-Setup.exe

  release:
    name: Publish release
    needs: [prepare, linux, macos, windows]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            artifacts/kordevance-linux-x86_64/kordevance-linux-x86_64.tar.gz
            artifacts/kordevance-linux-arm64/kordevance-linux-arm64.tar.gz
            artifacts/Kordevance-arm64.pkg/Kordevance-arm64.pkg
            artifacts/Kordevance-x86_64.pkg/Kordevance-x86_64.pkg
            artifacts/Kordevance-Setup.exe/Kordevance-Setup.exe
          generate_release_notes: true
