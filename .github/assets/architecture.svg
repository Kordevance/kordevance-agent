<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>

  <g>
    <rect x="30" y="140" width="170" height="80" rx="10" fill="#eef0f3" stroke="#c7ccd4" stroke-width="1"/>
    <text x="115" y="176" text-anchor="middle" font-size="13.5" font-weight="600" fill="#20242b">Client apps</text>
    <text x="115" y="194" text-anchor="middle" font-size="11" fill="#6b7280">owner + members</text>
  </g>
  <line x1="200" y1="180" x2="248" y2="180" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="120" width="200" height="120" rx="12" fill="#f4f6fb" stroke="#9aa7c7" stroke-width="1.4"/>
    <text x="350" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#14171c">Kordi Gateway</text>
    <text x="350" y="190" text-anchor="middle" font-size="11" fill="#6b7280">self-hosted · one process</text>
    <text x="350" y="205" text-anchor="middle" font-size="11" fill="#6b7280">per machine</text>
  </g>

  <line x1="450" y1="150" x2="498" y2="90" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="500" y="50" width="180" height="72" rx="10" fill="#fff4e8" stroke="#eccca0" stroke-width="1"/>
    <text x="590" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#7a4a10">ProxyRelay</text>
    <text x="590" y="98" text-anchor="middle" font-size="10.5" fill="#6b7280">connectors + OAuth + Tools</text>
  </g>

  <line x1="450" y1="180" x2="498" y2="180" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="500" y="144" width="180" height="72" rx="10" fill="#f1eefc" stroke="#d3c7ef" stroke-width="1"/>
    <text x="590" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#4b2c8f">LLM providers</text>
    <text x="590" y="192" text-anchor="middle" font-size="10.5" fill="#6b7280">your API key</text>
  </g>

  <line x1="450" y1="210" x2="498" y2="270" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="500" y="238" width="180" height="72" rx="10" fill="#f4f5f6" stroke="#c7ccd4" stroke-width="1"/>
    <text x="590" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#20242b">~/.kordevance</text>
    <text x="590" y="286" text-anchor="middle" font-size="10.5" fill="#6b7280">local storage, umask 0700</text>
  </g>
</svg>
